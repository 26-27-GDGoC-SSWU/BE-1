<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴지통</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<div style="margin: 20px;">
    <h2>휴지통 (삭제된 맛집)</h2>

    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <a href="/"><button type="button">홈으로 돌아가기</button></a>

        <!-- 휴지통 비우기 버튼 -->
        <form action="/restaurants/trash/clear" method="post" th:if="${!#lists.isEmpty(trashList)}">
            <button type="submit" onclick="return confirm('휴지통을 완전히 비우시겠습니까? 복구할 수 없습니다.');">
                휴지통 비우기
            </button>
        </form>
    </div>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
        <tr>
            <th>ID</th>
            <th>가게 이름</th>
            <th>카테고리</th>
            <th>대표 메뉴</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="restaurant : ${trashList}">
            <td th:text="${restaurant.id}">1</td>
            <td th:text="${restaurant.name}">식당 이름</td>
            <td th:text="${restaurant.category}">한식</td>
            <td th:text="${restaurant.foodName}">김치찌개</td>
            <td>
                <!-- 복구 버튼 -->
                <form th:action="@{/restaurants/{id}/restore(id=${restaurant.id})}" method="post" style="display: inline;">
                    <button type="submit">복구</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(trashList)}">
            <td colspan="5" style="text-align: center;">휴지통이 비어 있습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
