<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>맛집 상세 정보</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<div style="margin: 20px;" th:if="${restaurant != null}">
  <h2 th:text="${restaurant.name}">식당 이름</h2>

  <ul>
    <li><strong>카테고리:</strong> <span th:text="${restaurant.category}"></span></li>
    <li><strong>주소:</strong> <span th:text="${restaurant.address}"></span></li>
    <li><strong>음식 이름:</strong> <span th:text="${restaurant.foodName}"></span></li>
    <li><strong>가격:</strong> <span th:text="${restaurant.foodPrice} + '원'"></span></li>
    <li><strong>평점:</strong> <span th:text="${restaurant.rating}"></span></li>
    <li><strong>메모:</strong> <span th:text="${restaurant.memo}"></span></li>
  </ul>

  <br>
  <div style="display: flex; gap: 10px;">

    <a href="/"><button type="button">목록으로</button></a>

    <a th:href="@{/restaurants/{id}/edit(id=${restaurant.id})}">
      <button type="button">수정하기</button>
    </a>

    <form th:action="@{/restaurants/{id}/delete(id=${restaurant.id})}" method="post">
      <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
    </form>
  </div>
</div>

<div style="margin: 20px;" th:unless="${restaurant != null}">
  <p>존재하지 않거나 삭제된 맛집 정보입니다.</p>
  <a href="/"><button type="button">목록으로 돌아가기</button></a>
</div>
</body>
</html>
