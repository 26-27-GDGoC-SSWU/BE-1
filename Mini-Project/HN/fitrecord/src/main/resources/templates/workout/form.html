
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitRecord - 운동 기록 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>FitRecord</h1>
    <h2 th:text="${workout.id == null} ? '새 운동 기록' : '운동 기록 수정'">
        운동 기록 등록
    </h2>

    <p>오늘의 운동을 기록해 보세요!</p>

    <hr>

    <form th:action="${workout.id == null} ? @{/workouts} : @{/workouts/{id}/edit(id=${workout.id})}"
          th:object="${workout}"
          method="post">

        <div class="form-group">
            <label>운동 날짜</label>
            <input type="date" th:field="*{workoutDate}" required>
        </div>

        <div class="form-group">
            <label>운동 종류</label>
            <input type="text"
                   th:field="*{exerciseType}"
                   placeholder="예: 헬스, 러닝, 필라테스"
                   required>
        </div>

        <div class="form-group">
            <label>운동 시간 (분)</label>
            <input type="number"
                   th:field="*{duration}"
                   placeholder="예: 60"
                   min="1"
                   required>
        </div>

        <div class="form-group">
            <label>메모</label>
            <textarea th:field="*{memo}"
                      placeholder="오늘의 운동 내용을 기록해 보세요."></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn">저장하기</button>
            <a th:href="@{/}" class="btn btn-secondary">취소</a>
        </div>

    </form>

</div>

</body>
</html>
